<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 160" width="512" height="160" role="img" aria-label="xaker">
  <title>xaker</title>
  <defs>
    <!-- subtle grid background for the wordmark area -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1a1c22" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- mark: 8x8 grid + diagonal X with masked diagonal cells + amber center -->
  <g transform="translate(8, 16)">
    <rect width="128" height="128" rx="14" fill="#0a0b0e"/>
    <g stroke="#1f2229" stroke-width="0.5" fill="none">
      <line x1="16" y1="0" x2="16" y2="128"/>
      <line x1="32" y1="0" x2="32" y2="128"/>
      <line x1="48" y1="0" x2="48" y2="128"/>
      <line x1="64" y1="0" x2="64" y2="128"/>
      <line x1="80" y1="0" x2="80" y2="128"/>
      <line x1="96" y1="0" x2="96" y2="128"/>
      <line x1="112" y1="0" x2="112" y2="128"/>
      <line x1="0" y1="16" x2="128" y2="16"/>
      <line x1="0" y1="32" x2="128" y2="32"/>
      <line x1="0" y1="48" x2="128" y2="48"/>
      <line x1="0" y1="64" x2="128" y2="64"/>
      <line x1="0" y1="80" x2="128" y2="80"/>
      <line x1="0" y1="96" x2="128" y2="96"/>
      <line x1="0" y1="112" x2="128" y2="112"/>
    </g>
    <!-- off-diagonal crossing strokes -->
    <line x1="16" y1="16" x2="112" y2="112" stroke="#e8e6df" stroke-width="6" stroke-linecap="square"/>
    <line x1="112" y1="16" x2="16" y2="112" stroke="#e8e6df" stroke-width="6" stroke-linecap="square"/>
    <!-- masked diagonal cell + amber node -->
    <rect x="58" y="58" width="12" height="12" fill="#0a0b0e"/>
    <circle cx="64" cy="64" r="5" fill="#ff6b1a"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(160, 0)" fill="#e8e6df" font-family="Helvetica Neue, Helvetica, 'Liberation Sans', Arial, sans-serif" font-weight="700">
    <text x="0" y="92" font-size="76" letter-spacing="-3">xaker</text>
    <text x="3" y="124" font-size="14" letter-spacing="3.6" fill="#9a9890" font-weight="600">ATTENTION, SOLVED.</text>
  </g>
</svg>
