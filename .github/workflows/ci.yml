name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Single-word naming guard
        run: |
          # Single-word naming rule. xaker/ public symbols are single
          # words. Four enforced rules with a small allow-list of
          # pre-existing underscore helpers that exist for legacy
          # reasons (see comments).
          #
          # 1. Function names with two or more underscores
          #    (three or more word parts) are forbidden.
          # 2. Multi-word PascalCase class names are forbidden.
          # 3. Leading-underscore identifiers (private convention)
          #    are forbidden except for the standard dunder names.
          # 4. `import x as y` / `from x import y as z` aliasing
          #    imports are forbidden.
          ! git grep -nE '\bdef [a-z]+(_[a-z]+){2,} ?\(' xaker/ | grep -v "def pytest_" || (echo "Multi-word function names found"; exit 1)
          ! git grep -nE '\bclass [A-Z][a-zA-Z]*[A-Z]' xaker/ || (echo "Multi-word PascalCase class names found"; exit 1)
          # Leading underscore: '_' must be the first character of an
          # identifier, not part of one ('vocab_size' is fine; '_foo' is
          # not). Allow-list of pre-existing underscore helpers
          # (rename in a follow-up; tracked inline below):
          #   _device       xaker/bench/ablate.py
          #   _sync         xaker/bench/bench.py
          #   _summary_md   xaker/bench/bench.py
          #   _DS           xaker/bench/lra.py (private inner Dataset)
          #   _signature    xaker/solver/precond.py (cache signature)
          #   _cache_keys   xaker/solver/precond.py (cache state)
          #   _load         xaker/datasets/__init__.py (cache loader)
          #   _synthetic_corpus xaker/datasets/__init__.py
          #   _grep_count   xaker/rubric/grader.py (internal grep helper)
          ! git grep -nE '(^|[[:space:]()=,])_[A-Za-z][A-Za-z0-9]*' xaker/ | grep -vE '__init__|__all__|__version__|__future__|__pycache__' | grep -vE '\b_(device|sync|DS|signature|cache_keys|load|synthetic_corpus|summary_md|grep_count|t)\b' || (echo "Leading-underscore names found beyond the allow-list"; exit 1)
          ! git grep -nE 'import .* as |from .* import .* as ' xaker/ | grep -v ' import time as _t' || (echo "Aliasing imports found beyond the allow-list"; exit 1)

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,paper]"

      - name: Lint with pylint
        run: |
          pylint xaker/ --rcfile=pyproject.toml --fail-under=9.5

      - name: Type check with mypy
        run: |
          mypy xaker/ --ignore-missing-imports --no-implicit-optional --warn-unused-ignores

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=xaker --cov-report=xml:coverage.xml --cov-report=json:coverage.json --cov-fail-under=90 --strict-markers -m "not slow"
      - name: Refresh STATUS.md from the live run
        if: matrix.python-version == '3.12'
        run: |
          python scripts/refresh_status.py
          git diff --exit-code STATUS.md || (echo "STATUS.md drifted from CI; review the new values." && exit 1)

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests

  rubric:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run paper-worthiness rubric
        run: |
          xaker-validate --repo-root . --min-total 14

  build:
    runs-on: ubuntu-latest
    needs: [test, rubric]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/