name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Single-word naming guard
        run: |
          ! git grep -nE '\bdef [a-z]+_[a-z_]+ ?\(' xaker/ | grep -v "def pytest_" || (echo "Multi-word function names found"; exit 1)
          ! git grep -nE '\bclass [A-Z][a-zA-Z]*[A-Z]' xaker/ || (echo "Multi-word PascalCase class names found"; exit 1)
          ! git grep -rnE '\b_[a-zA-Z]' xaker/ --include='*.py' | grep -v "__init__\|__all__\|__version__\|__future__" || (echo "Leading-underscore names found"; exit 1)
          ! git grep -rnE 'import .* as |from .* import .* as ' xaker/ --include='*.py' || (echo "Aliasing imports found"; exit 1)

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,paper]"

      - name: Lint with pylint
        run: |
          pylint xaker/ --rcfile=pyproject.toml --fail-under=9.5 || true

      - name: Type check with mypy
        run: |
          mypy xaker/ --ignore-missing-imports --no-implicit-optional --warn-unused-ignores

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=xaker --cov-report=xml --cov-fail-under=85 --strict-markers -m "not slow"

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests

  rubric:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run paper-worthiness rubric
        run: |
          xaker-validate --repo-root . --min-total 14

  build:
    runs-on: ubuntu-latest
    needs: [test, rubric]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/