name: Benchmark Regression

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,paper]"

      - name: Run benchmark
        run: |
          python -m xaker.cli.bench \
            --dim 256 \
            --heads 4 \
            --lengths 32 64 128 \
            --kinds standard xsa fused \
            --runs 30 \
            --output benchmark_results.json

      - name: Summarise results
        run: |
          python -c "
          import json
          import sys

          try:
              with open('benchmark_results.json') as f:
                  current = json.load(f)
          except FileNotFoundError:
              print('::warning::No benchmark results found, skipping summary')
              sys.exit(0)

          print('## Benchmark Results')
          print()
          print('| Kind | Length | Forward (ms) | Backward (ms) |')
          print('|------|--------|--------------|---------------|')

          for key, m in current.get('results', {}).items():
              kind, length = key.split(':')
              print(f\"| {kind} | {length} | {m['forward_ms_mean']:.2f} | {m['backward_ms_mean']:.2f} |\")
          "

      - name: Store benchmark results
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark_results.json
          retention-days: 30

      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            let results;
            try {
              results = JSON.parse(fs.readFileSync('benchmark_results.json', 'utf8'));
            } catch (e) {
              console.log('No benchmark results file found, skipping comment');
              return;
            }

            let body = '## Benchmark Results\n\n';
            body += '| Kind | Length | Forward (ms) | Backward (ms) |\n';
            body += '|------|--------|--------------|---------------|\n';

            for (const [key, m] of Object.entries(results.results || {})) {
              const [kind, length] = key.split(':');
              body += `| ${kind} | ${length} | ${m.forward_ms_mean.toFixed(2)} | ${m.backward_ms_mean.toFixed(2)} |\n`;
            }

            body += '\n*Benchmark run on CPU with `dim=256`, `heads=4`, `runs=30`*\n';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });